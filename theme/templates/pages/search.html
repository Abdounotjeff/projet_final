{% extends "base.html" %}
{% load static%}
{% block styl %}
<link rel="stylesheet" href="{% static 'css/dist/products.css' %}">
{% endblock %}
{% block content %}


<div class="flex flex-row w-full pr-24 pl-24">

    <div class="min-w-1/2 m-5">
        <div class="max-w-xs mx-auto bg-white p-6 rounded-lg shadow-lg">
            <!-- Filtrer par Prix -->
            <div class="mb-6">
              <h3 class="font-bold text-black mb-2">FILTRER PAR PRIX</h3>
              <input type="range" min="1600" max="8000" class="w-full mb-2" id="priceRange" oninput="updatePrice()">
              <div class="flex justify-between items-center text-sm text-black">
                <span id="minPrice">1600 د.ج</span>
                <span id="maxPrice">8000 د.ج</span>
              </div>
              <button class="mt-3 bg-gray-200 text-black px-4 py-2 rounded-lg">FILTRER</button>
            </div>
        
            <hr class="my-4">
        
            <!-- Filtrer par Pointures -->
            <div class="mb-6">
              <h3 class="font-bold text-black mb-2">FILTRE PAR POINTURES</h3>
              <div class="grid grid-cols-2 gap-2">
                <label class="text-black"><input type="checkbox" class="mr-2">35</label>
                <label class="text-black"><input type="checkbox" class="mr-2">36</label>
                <label class="text-black"><input type="checkbox" class="mr-2">37</label>
                <label class="text-black"><input type="checkbox" class="mr-2">38</label>
                <label class="text-black"><input type="checkbox" class="mr-2">39</label>
                <label class="text-black"><input type="checkbox" class="mr-2">40</label>
                <label class="text-black"><input type="checkbox" class="mr-2">41</label>
                <label class="text-black"><input type="checkbox" class="mr-2">42</label>
                <label class="text-black"><input type="checkbox" class="mr-2">43</label>
                <label class="text-black"><input type="checkbox" class="mr-2">44</label>
              </div>
            </div>
        
            <hr class="my-4">
        
            <!-- Catégories de Produits -->
            <div class="mb-6">
              <h3 class="font-bold text-black mb-2">CATÉGORIES DE PRODUITS</h3>
              <select class="w-full bg-gray-200 p-2 rounded-lg text-black">
                <option>Sélectionner une catégorie</option>
                <option>Chaussures</option>
                <option>Vêtements</option>
                <option>Accessoires</option>
              </select>
            </div>
        
            <hr class="my-4">
        
            <!-- Stock Status -->
            <div>
              <h3 class="font-bold text-black mb-2">STOCK STATUS</h3>
              <div class="space-y-2 justify-between">
                <label class="text-black mr-2"><input type="checkbox" class="mr-2">En vente</label>
                <label class="text-black"><input type="checkbox" class="mr-2">En stock</label>
              </div>
            </div>
        
          </div>
        <!-- products -->
    </div>
    <section class="bg-white   Paladium">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 p-4">
        <!-- Item 1 -->
        <div class="bg-white shadow-lg rounded-lg overflow-hidden h-96 w-60 ">
            <img src="{% static "img/hero.jpg" %}" alt="Mango shirt style denim jacket in dark blue" class="w-full h-auto">
            <div class="p-4">
                <h3 class="text-black text-xl font-semibold">Mango shirt style denim jacket in dark blue</h3>
                <p class="mt-2 text-gray-900 font-bold">$100.00</p>
            </div>
            <div class="p-4 flex justify-end">
                <button class="focus:outline-none">
                    <svg class="w-6 h-6 text-black hover:text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                </button>
            </div>
        </div>
    
        
        
    </div>
    
    </section>
    {% endblock %}
